  --glass: rgb(30 30 34 / .52); --glass-solid: rgb(30 30 34 / .94); --stroke: rgb(255 255 255 / .14);

  --fill: rgb(0 0 0 / .05); --hover: rgb(0 0 0 / .09); --chip-on: #fff; --sep: rgb(0 0 0 / .07);

* { box-sizing: border-box; }
[hidden] { display: none !important; }

/* top bar */
header { position: fixed; top: calc(var(--gap) + env(safe-area-inset-top)); left: calc(var(--gap) + env(safe-area-inset-left)); right: calc(var(--panel-w) + 2 * var(--gap)); height: 48px;
  display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-radius: 999px; z-index: 2; }

/* both export buttons (.magic): a slowly swirling rainbow (conic gradient turning around a drifting centre, under a gloss

@property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  background:
    radial-gradient(120% 90% at 30% 0%, rgb(255 255 255 / .45), transparent 55%),
    conic-gradient(from var(--spin) at var(--cx) 60%, #00c7ff, #0a84ff, #5e5ce6, #bf5af2, #ff2d92, #ff6b2c, #ffd60a, #30d158, #00c7ff);

/* a modal takes focus itself; its controls keep their own focus rings, the box needs none */
dialog:focus, dialog:focus-visible { outline: none; }
/* rim (dialogs, start card): a faint 1 px pastel rainbow ring, equally strong all round, turning slowly (masked to the border, so the glass inside stays clear) */
.rim { border: 0; }

.bar i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .7), transparent) no-repeat;
  background-size: 40px 100%; animation: barglint 1.6s ease-in-out infinite; }
.bar.indet { overflow: hidden; }
.bar.indet i { width: 36%; transition: none; animation: barflow 2.4s linear infinite, indet 1.5s cubic-bezier(.45, 0, .55, 1) infinite;
  -webkit-mask: linear-gradient(90deg, transparent, #000 35%, #000 70%, transparent); mask: linear-gradient(90deg, transparent, #000 35%, #000 70%, transparent); }
@keyframes barflow { to { background-position: 240px 0; } }
@keyframes barglint { from { background-position: -40px 0; } to { background-position: calc(100% + 40px) 0; } }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
@media (prefers-reduced-motion: reduce) { .bar i, .bar i::after { animation: none; } .bar.indet i { width: 100%; } }

/* status line */
#status { position: fixed; left: calc(var(--gap) + env(safe-area-inset-left)); bottom: calc(var(--gap) + env(safe-area-inset-bottom)); max-width: calc(100% - var(--panel-w) - 3 * var(--gap));
  padding: 8px 14px; border-radius: 999px; color: var(--mute); z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 760px) {
  :root { --gap: 8px; }
  header { right: var(--gap); }
  .brand b { display: none; }
  aside { top: auto; left: var(--gap); width: auto; max-height: 44dvh; border-radius: 22px; }
  #status { bottom: calc(44dvh + 2 * var(--gap)); max-width: calc(100% - 2 * var(--gap)); }

  body.panel-off aside { transform: translateY(calc(100% + 2 * var(--gap))); }

}

// Bundled from src/ by tools/build.mjs: each module becomes a Blob URL, imports rewritten to them, then app.js runs.
const M = {"shaders.js":"export const VS = `#version 300 es\r\nvoid main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2. - 1., 0, 1); }`;\r\n\r\n// ---- raw development: normalize -> (optional denoise) -> demosaic ----\r\n// Raw CFA ints -> normalized [0,1] floats.\r\nexport const NORM = `#version 300 es\r\nprecision highp float; precision highp usampler2D;\r\nuniform usampler2D u_raw; uniform float u_black, u_scale;\r\nout vec4 o;\r\nvoid main() { o = vec4(max((float(texelFetch(u_raw, ivec2(gl_FragCoord.xy), 0).r) - u_black) * u_scale, 0.)); }`;\r\n\r\n// LinearRaw (already demosaiced, e.g. Lightroom Enhanced DNG): just normalize.\r\nexport const LINEARRAW = `#version 300 es\r\nprecision highp float; precision highp usampler2D;\r\nuniform usampler2D u_raw; uniform float u_black, u_scale;\r\nout vec4 o;\r\nvoid main() { o = vec4(max((vec3(texelFetch(u_raw, ivec2(gl_FragCoord.xy), 0).rgb) - u_black) * u_scale, 0.), 1); }`;\r\n\r\n// Denoise, step 1: pack each 2x2 CFA cell into one texel, apply the generalized Anscombe transform with the DNG\r\n// NoiseProfile (variance = a·x + b·a²) so noise becomes unit-variance Gaussian, then rotate the four planes into an\r\n// orthonormal luma / chroma basis (so luma and color noise can be treated separately without changing the noise level).\r\nexport const NR_PACK = `#version 300 es\r\nprecision highp float; precision highp usampler2D;\r\nuniform usampler2D u_raw; uniform float u_black, u_scale, u_a, u_b; uniform ivec4 u_perm; // 2x2 index of R, G1, G2, B\r\nout vec4 o;\r\nvoid main() {\r\n  ivec2 P = ivec2(gl_FragCoord.xy) * 2; float v[4];\r\n  for (int k = 0; k < 4; k++) {\r\n    float x = (float(texelFetch(u_raw, P + ivec2(k & 1, k >> 1), 0).r) - u_black) * u_scale;\r\n    v[k] = 2. * sqrt(max(x / u_a + .375 + u_b, 0.));\r\n  }\r\n  float r = v[u_perm.x], g1 = v[u_perm.y], g2 = v[u_perm.z], b = v[u_perm.w];\r\n  o = vec4(r + g1 + g2 + b, r - g1 - g2 + b, 1.41421356 * (r - b), 1.41421356 * (g1 - g2)) * .5;\r\n}`;\r\n\r\n// Denoise, step 2: one level of the à-trous B3-spline wavelet (5x5 kernel with holes), mirrored borders.\r\nexport const NR_ATROUS = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_src; uniform int u_step;\r\nout vec4 o;\r\nconst float h[5] = float[](.0625, .25, .375, .25, .0625);\r\nvoid main() {\r\n  ivec2 P = ivec2(gl_FragCoord.xy), M = textureSize(u_src, 0) - 1; vec4 s = vec4(0);\r\n  for (int j = 0; j < 5; j++) for (int i = 0; i < 5; i++) {\r\n    ivec2 q = abs(P + ivec2(i - 2, j - 2) * u_step);\r\n    s += h[i] * h[j] * texelFetch(u_src, min(q, 2 * M - q), 0);\r\n  }\r\n  o = s;\r\n}`;\r\n\r\n// Denoise, step 3: soft-threshold this level's detail (fine - coarse) and add it to the running reconstruction.\r\nexport const NR_DETAIL = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_c, u_cn, u_acc; uniform vec4 u_thr; uniform bool u_first;\r\nout vec4 o;\r\nvoid main() {\r\n  ivec2 P = ivec2(gl_FragCoord.xy);\r\n  vec4 w = texelFetch(u_c, P, 0) - texelFetch(u_cn, P, 0);\r\n  o = (u_first ? vec4(0) : texelFetch(u_acc, P, 0)) + sign(w) * max(abs(w) - u_thr, 0.);\r\n}`;\r\n\r\n// Denoise alternative: non-local means on the packed, variance-stabilized planes. Similarity is measured on luma\r\n// (3x3 patches, unit-variance noise, so the expected noise-only distance 2σ² is subtracted), and all four planes are\r\n// averaged with the same weights.\r\nexport const NR_NLM = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_src; uniform float u_h2, u_sig2; uniform int u_R;\r\nout vec4 o;\r\nivec2 M;\r\nfloat Y(ivec2 p) { return texelFetch(u_src, clamp(p, ivec2(0), M), 0).x; }\r\nvoid main() {\r\n  ivec2 P = ivec2(gl_FragCoord.xy); M = textureSize(u_src, 0) - 1;\r\n  float c[9];\r\n  for (int k = 0; k < 9; k++) c[k] = Y(P + ivec2(k % 3 - 1, k / 3 - 1));\r\n  vec4 sum = vec4(0); float ws = 0.;\r\n  for (int dy = -u_R; dy <= u_R; dy++) for (int dx = -u_R; dx <= u_R; dx++) {\r\n    ivec2 q = P + ivec2(dx, dy); float d = 0.;\r\n    for (int k = 0; k < 9; k++) { float e = c[k] - Y(q + ivec2(k % 3 - 1, k / 3 - 1)); d += e * e; }\r\n    float w = exp(-max(d / 9. - 2. * u_sig2, 0.) / u_h2);\r\n    sum += w * texelFetch(u_src, clamp(q, ivec2(0), M), 0); ws += w;\r\n  }\r\n  o = sum / ws;\r\n}`;\r\n\r\n// Denoise, step 4: details + coarsest level, inverse rotation, unpack to the CFA mosaic, and invert the Anscombe\r\n// transform with the Mäkitalo–Foi closed-form unbiased inverse (a plain algebraic inverse would darken the shadows).\r\nexport const NR_UNPACK = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_acc, u_c; uniform ivec4 u_perm; uniform float u_a, u_b;\r\nout vec4 o;\r\nvoid main() {\r\n  ivec2 Q = ivec2(gl_FragCoord.xy);\r\n  vec4 t = texelFetch(u_acc, Q / 2, 0) + texelFetch(u_c, Q / 2, 0);\r\n  float sY = .5 * (t.x + t.y), dY = .5 * (t.x - t.y), z = .70710678;\r\n  float v[4];\r\n  v[u_perm.x] = sY + z * t.z; v[u_perm.w] = sY - z * t.z; v[u_perm.y] = dY + z * t.w; v[u_perm.z] = dY - z * t.w;\r\n  float y = max(v[(Q.x & 1) + 2 * (Q.y & 1)], 1.), y2 = y * y;\r\n  float n = .25 * y2 + .30618622 / y - 1.375 / y2 + .76546554 / (y2 * y) - .125;\r\n  o = vec4(max(u_a * (n - u_b), 0.));\r\n}`;\r\n\r\n// Demosaic, RCD style (ratio-corrected demosaicing, L. Sanz Rodríguez 2017; implemented from its description; it beat\r\n// Hamilton–Adams by 0.8-3 dB in tools/demosaic-bench.html). Every color-difference step (green, red/blue, CA,\r\n// false-color median) works on white-balanced values (u_wb, the as-shot multipliers): unbalanced, a neutral detail\r\n// brighter than its surroundings would inherit their R−G / B−G and turn pink. Outputs stay in camera units. 1) Direction: local detail energy along each axis (and each diagonal) as a\r\n// 0..1 ratio, so a pixel interpolates along its edge, not across it.\r\nconst RCD_HEAD = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_cfaTex; uniform ivec4 u_cfa; uniform vec3 u_wb;\r\nout vec4 o;\r\nivec2 P, S;\r\nint col(ivec2 q) { return u_cfa[(q.y & 1) * 2 + (q.x & 1)]; }\r\nfloat c(ivec2 d) { ivec2 q = clamp(P + d, ivec2(0), S - 1); return texelFetch(u_cfaTex, q, 0).r * u_wb[col(q)]; }\r\n`;\r\nexport const RCD_DIR = RCD_HEAD + `\r\nfloat e(ivec2 p, ivec2 d) { float a = c(p - d) - c(p + d), b = 2. * c(p) - c(p - 2 * d) - c(p + 2 * d); return a * a + .25 * b * b; }\r\nfloat stat(ivec2 d) { return e(-d, d) + e(ivec2(0), d) + e(d, d); }\r\nvoid main() {\r\n  P = ivec2(gl_FragCoord.xy); S = textureSize(u_cfaTex, 0);\r\n  float v = stat(ivec2(0, 1)), h = stat(ivec2(1, 0)), p = stat(ivec2(1, 1)), q = stat(ivec2(1, -1));\r\n  o = vec4(v / (v + h + 1e-12), p / (p + q + 1e-12), 0, 1);\r\n}`;\r\n// 2) Low-pass of the mosaic (all colors mixed): the ratio corrections below compare it at two sites.\r\nexport const RCD_LPF = RCD_HEAD + `\r\nvoid main() {\r\n  P = ivec2(gl_FragCoord.xy); S = textureSize(u_cfaTex, 0);\r\n  o = vec4(.25 * c(ivec2(0)) + .125 * (c(ivec2(-1, 0)) + c(ivec2(1, 0)) + c(ivec2(0, -1)) + c(ivec2(0, 1)))\r\n    + .0625 * (c(ivec2(-1, -1)) + c(ivec2(1, -1)) + c(ivec2(-1, 1)) + c(ivec2(1, 1))));\r\n}`;\r\n// direction weight: the pixel's own, or its neighbours' mean when that is more decided (RCD's refinement)\r\nconst RCD_DISC = `\r\nfloat disc(sampler2D t, int ch, bool diag) {\r\n  float m = texelFetch(t, P, 0)[ch], n = 0.;\r\n  for (int k = 0; k < 4; k++) {\r\n    ivec2 d = diag ? ivec2(k & 1, k >> 1) * 2 - 1 : ivec2(k == 0 ? -1 : k == 1 ? 1 : 0, k == 2 ? -1 : k == 3 ? 1 : 0);\r\n    n += .25 * texelFetch(t, clamp(P + d, ivec2(0), S - 1), 0)[ch];\r\n  }\r\n  return abs(.5 - m) < abs(.5 - n) ? n : m;\r\n}`;\r\n// 3) Green at red/blue sites: each neighbour green scaled by the low-pass ratio between here and its far side, the\r\n// two sides of an axis weighted by their gradients, the axes blended by the direction weight.\r\nexport const RCD_GREEN = RCD_HEAD + RCD_DISC + `\r\nuniform sampler2D u_dir, u_lpf;\r\nfloat L(ivec2 d) { return texelFetch(u_lpf, clamp(P + d, ivec2(0), S - 1), 0).r; }\r\nfloat grad(ivec2 d) { return 1e-5 + abs(c(d) - c(-d)) + abs(c(ivec2(0)) - c(2 * d)) + abs(c(d) - c(3 * d)) + abs(c(2 * d) - c(4 * d)); }\r\nfloat est(ivec2 d) { return c(d) * 2. * L(ivec2(0)) / (1e-5 + L(ivec2(0)) + L(2 * d)); }\r\nfloat axis(ivec2 d) { float a = grad(-d), b = grad(d); return (a * est(d) + b * est(-d)) / (a + b); }\r\nvoid main() {\r\n  P = ivec2(gl_FragCoord.xy); S = textureSize(u_cfaTex, 0);\r\n  if (col(P) == 1) { o = vec4(c(ivec2(0))); return; }\r\n  float w = disc(u_dir, 0, true);\r\n  o = vec4(max(w * axis(ivec2(1, 0)) + (1. - w) * axis(ivec2(0, 1)), 0.));\r\n}`;\r\n// 4) At red/blue sites the other of the two, from color differences along the diagonals (diagonal direction weight).\r\nexport const RCD_RB1 = RCD_HEAD + RCD_DISC + `\r\nuniform sampler2D u_dir, u_green;\r\nfloat G(ivec2 d) { return texelFetch(u_green, clamp(P + d, ivec2(0), S - 1), 0).r; }\r\nfloat grad(ivec2 d) { return 1e-5 + abs(c(d) - c(-d)) + abs(c(d) - c(3 * d)) + abs(G(ivec2(0)) - G(2 * d)); }\r\nfloat axis(ivec2 d) { float a = grad(-d), b = grad(d); return (a * (c(d) - G(d)) + b * (c(-d) - G(-d))) / (a + b); }\r\nvoid main() {\r\n  P = ivec2(gl_FragCoord.xy); S = textureSize(u_cfaTex, 0);\r\n  int k = col(P); float g = G(ivec2(0)), x = c(ivec2(0));\r\n  if (k == 1) { o = vec4(0, g, 0, 1); return; }\r\n  float w = disc(u_dir, 1, false), y = g + w * axis(ivec2(1, -1)) + (1. - w) * axis(ivec2(1, 1));\r\n  o = vec4(k == 0 ? vec3(x, g, y) : vec3(y, g, x), 1);\r\n}`;\r\n// 5) At green sites red and blue from the four red/blue neighbours (now complete), axis direction weight; then back to\r\n// camera units. alpha codes which colors have a clipped raw site in the 3×3 around (bits R 1, G 2, B 4; alpha =\r\n// 1 - bits/8): those values are only a lower bound (green clips first, so usually magenta); HL_RECON rebuilds them.\r\nexport const RCD_RB2 = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_rb, u_dir; uniform ivec4 u_cfa; uniform vec3 u_wb;\r\nuniform highp usampler2D u_raw; uniform float u_clip;\r\nout vec4 o;\r\nivec2 P, S;\r\nint col(ivec2 q) { return u_cfa[(q.y & 1) * 2 + (q.x & 1)]; }\r\nvec3 X(ivec2 d) { return texelFetch(u_rb, clamp(P + d, ivec2(0), S - 1), 0).rgb; }\r\n` + RCD_DISC + `\r\nvec2 grad(ivec2 d) { vec3 a = X(d), b = X(-d), f = X(3 * d); return 1e-5 + abs(X(ivec2(0)).g - X(2 * d).g) + abs(a.rb - b.rb) + abs(a.rb - f.rb); }\r\nvec2 axis(ivec2 d) { vec2 a = grad(-d), b = grad(d); return (a * (X(d).rb - X(d).g) + b * (X(-d).rb - X(-d).g)) / (a + b); }\r\nvoid main() {\r\n  P = ivec2(gl_FragCoord.xy); S = textureSize(u_rb, 0);\r\n  vec3 rgb = X(ivec2(0));\r\n  if (col(P) == 1) { float w = disc(u_dir, 0, true); rgb.rb = rgb.g + w * axis(ivec2(1, 0)) + (1. - w) * axis(ivec2(0, 1)); }\r\n  int m = 0;\r\n  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {\r\n    ivec2 q = clamp(P + ivec2(x, y), ivec2(0), S - 1);\r\n    if (float(texelFetch(u_raw, q, 0).r) >= u_clip) m |= 1 << col(q);\r\n  }\r\n  o = vec4(max(rgb / u_wb, 0.), 1. - float(m) / 8.);\r\n}`;\r\n\r\n// Highlight reconstruction. Most \"blown\" sky is clipped in one or two colors only (green first): the others still hold\r\n// its brightness and detail. 1) Guide: the mean white-balanced color of pixels with nothing clipped nearby, at quarter\r\n// resolution, mipmapped (alpha = their share), so each clipped pixel finds its nearest unclipped surroundings.\r\nexport const HL_GUIDE = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_src; uniform vec3 u_wb;\r\nout vec4 o;\r\nvoid main() {\r\n  ivec2 P = ivec2(gl_FragCoord.xy) * 4, S = textureSize(u_src, 0); vec4 s = vec4(0);\r\n  for (int y = 0; y < 4; y++) for (int x = 0; x < 4; x++) {\r\n    vec4 c = texelFetch(u_src, min(P + ivec2(x, y), S - 1), 0);\r\n    if (c.a == 1.) s += vec4(c.rgb * u_wb, 1);\r\n  }\r\n  o = s / 16.;\r\n}`;\r\n\r\n// 2) Where some colors clipped, the survivors set the brightness and the guide (finest level with unclipped\r\n// neighbours) the color. A clipped value is only ever raised: the true one was at least what was recorded. All three\r\n// clipped: kept and marked (alpha 0) for the stitch to render neutral; otherwise alpha 1.\r\nexport const HL_RECON = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_src, u_guide; uniform vec3 u_wb; uniform float u_lods;\r\nout vec4 o;\r\nvoid main() {\r\n  ivec2 P = ivec2(gl_FragCoord.xy); vec4 C = texelFetch(u_src, P, 0);\r\n  int m = int(round((1. - C.a) * 8.));\r\n  if (m == 0 || m == 7) { o = vec4(C.rgb, m == 7 ? 0. : 1.); return; }\r\n  vec2 uv = (vec2(P) + .5) / vec2(textureSize(u_src, 0));\r\n  vec4 g = vec4(0);\r\n  for (float l = 0.; l <= u_lods; l++) { g = textureLod(u_guide, uv, l); if (g.a > .01) break; }\r\n  if (g.a <= .01) { o = vec4(C.rgb, 0.); return; }\r\n  vec3 known = vec3((m & 1) == 0, (m & 2) == 0, (m & 4) == 0), c = C.rgb * u_wb, ch = g.rgb / g.a;\r\n  vec3 est = min(dot(c, known) / max(dot(ch, known), 1e-6) * ch, vec3(8));\r\n  o = vec4(mix(max(c, est), c, known) / u_wb, 1.);\r\n}`;\r\n\r\n// False-color suppression after demosaicing (median filtering of color, after Freeman 1988; the patent expired):\r\n// log(R/G) and log(B/G), white-balanced, become their 5-tap median along u_dir, run once across and once down.\r\n// Detail thinner than the red/blue sampling (twigs, wires: ~2 px) gets the color around it instead of an aliased guess,\r\n// and a channel's blur tail beside a bright edge (an outlier ratio) is dropped; larger colored areas keep theirs.\r\n// Ratios, unlike differences, do not depend on brightness: a bright neutral twig on dark leaves stays neutral.\r\nexport const CHROMA_MED = `#version 300 es\r\nprecision highp float;\r\nuniform sampler2D u_src; uniform ivec2 u_dir; uniform vec3 u_wb;\r\nout vec4 o;\r\nvoid sort2(inout vec2 a, inout vec2 b) { vec2 t = min(a, b); b = max(a, b); a = t; } // per channel\r\nconst float E = .002; // keeps the ratios of near-black pix -> green -> (lateral CA) -> red/blue -> false-color\n// median -> camera RGB (RGBA16F + mipmaps).\nimport { NORM, LINEARRAW, NR_PACK, NR_ATROUS, NR_DETAIL, NR_UNPACK, NR_NLM, RCD_DIR, RCD_LPF, RCD_GREEN, RCD_RB1, RCD_RB2, CA_CFA, CHROMA_MED, HL_GUIDE, HL_RECON } from './shaders.js';\n\n// Noise of unit-variance white noise at each level of the B3 à-trous transform: thresholds are in these units.\nconst ATROUS_SIGMA = [0.8908, 0.2007, 0.0856, 0.0413, 0.0205];\nconst MED_PASSES = 2; // false-color median rounds (across + down)\nconst SCRATCH = ['cfa', 'cfaCA', 'green', 'rcdDir', 'rcdLpf', 'rgb', 'hlGuide', 'nrA', 'nrB', 'nrC', 'nrD', 'nrN'];\n\nexport function createDeveloper({ gl, program, texture, tgt, free, pass, finish }) {\n  const P = Object.fromEntries(Object.entries({ NORM, LINEARRAW, NR_PACK, NR_ATROUS, NR_DETAIL, NR_UNPACK, NR_NLM, RCD_DIR, RCD_LPF, RCD_GREEN, RCD_RB1, RCD_RB2, CA_CFA, CHROMA_MED, HL_GUIDE, HL_RECON })\n    .map(([k, v]) => [k, program(v)]));\n  const aniso = gl.getExtension('EXT_texture_filter_anisotropic');\n\n  // Keep the raw upload so noise reduction can be re-run; `tex` receives the developed image.\n  function upload(d) {\n    const { width: W, height: H } = d, lin = d.channels === 3;\n    const raw = texture(gl.TEXTURE_2D, gl.NEAREST);\n    gl.texImage2D(gl.TEXTURE_2D, 0, lin ? gl.RGB16UI : gl.R16UI, W, H, 0, lin ? gl.RGB_INTEGER : gl.RED_INTEGER, gl.UNSIGNED_SHORT, d.raw);\n    const tex = texture();\n    gl.texStorage2D(gl.TEXTURE_2D, 1 + Math.floor(Math.log2(Math.max(W, H))), gl.RGBA16F, W, H);\n    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, 8);\n    return { raw, tex };\n  }\n\n  // opts: nr / nrc = luma / color strength 0..100, method = 'wavelet' | 'nlm', nlmR = NLM search radius,\n  // ca = { R, B, cac, cam } lateral CA model applied to the mosaic (see CA_CFA)\n  function develop(L, opts = {}) {\n    const d = L.src, W = d.width, H = d.height;\n    const norm = u => { gl.uniform1f(u.u_black, d.black); gl.uniform1f(u.u_scale, 1 / (d.white - d.black)); };\n    const fb = gl.createFramebuffer();\n    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);\n    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, L.tex, 0);\n    if (d.channels === 3) pass(P.LINEARRAW, fb, W, H, [['u_raw', L.raw]], norm);\n    else {\n      const cfa = tgt('cfa', gl.R32F, W, H);\n      if ((opts.nr || opts.nrc) && d.noise) denoise(L, cfa, opts);\n      else pass(P.NORM, cfa.fb, W, H, [['u_raw', L.raw]], norm);\n      // RCD demosaic: directions and low-pass, green, then red/blue from color differences (see the RCD_* shaders)\n      const wb = d.neutral.map(v => d.neutral[1] / v); // as-shot white balance, green = 1\n      const green = tgt('green', gl.R16F, W, H), dir = tgt('rcdDir', gl.RG16F, W, H), lpf = tgt('rcdLpf', gl.R16F, W, H);\n      const cfaU = u => { gl.uniform4iv(u.u_cfa, d.cfa); gl.uniform3fv(u.u_wb, wb); };\n      const greenFrom = t => {\n        pass(P.RCD_DIR, dir.fb, W, H, [['u_cfaTex', t.tex]], cfaU);\n        pass(P.RCD_LPF, lpf.fb, W, H, [['u_cfaTex', t.tex]], cfaU);\n        pass(P.RCD_GREEN, green.fb, W, H, [['u_cfaTex', t.tex], ['u_dir', dir.tex], ['u_lpf', lpf.tex]], cfaU);\n      };\n      let src = cfa;\n      greenFrom(src);\n      if (opts.ca) { // move red/blue into place, then redo green (its gradients use them)\n        const { R, B, cac, cam } = opts.ca;\n        src = tgt('cfaCA', gl.R32F, W, H);\n        pass(P.CA_CFA, src.fb, W, H, [['u_cfaTex', cfa.tex], ['u_green', green.tex]], u => {\n          cfaU(u); gl.uniform4fv(u.u_kR, R); gl.uniform4fv(u.u_kB, B); gl.uniform2fv(u.u_cac, cac); gl.uniform1f(u.u_cam, cam);\n        });\n        greenFrom(src);\n      }\n      const rgb = tgt('rgb', gl.RGBA16F, W, H), med = dir => u => { gl.uniform2i(u.u_dir, ...dir); gl.uniform3fv(u.u_wb, wb); };\n      pass(P.RCD_RB1, rgb.fb, W, H, [['u_cfaTex', src.tex], ['u_dir', dir.tex], ['u_green', green.tex]], cfaU);\n      pass(P.RCD_RB2, fb, W, H, [['u_rb', rgb.tex], ['u_dir', dir.tex], ['u_raw', L.raw]], u => { cfaU(u); gl.uniform1f(u.u_clip, d.clip ?? d.white); });\n      for (let i = 0; i < (opts.medPasses ?? MED_PASSES); i++) { // repeated, like dcraw's median passes: each one reaches further\n        pass(P.CHROMA_MED, rgb.fb, W, H, [['u_src', L.tex]], med([1, 0]));\n        pass(P.CHROMA_MED, fb, W, H, [['u_src', rgb.tex]], med([0, 1]));\n      }\n      // highlight reconstruction (HL_GUIDE, HL_RECON), then back into the lens texture\n      const gw = Math.ceil(W / 4), gh = Math.ceil(H / 4), lv = Math.floor(Math.log2(Math.max(gw, gh))) + 1;\n      const guide = tgt('hlGuide', gl.RGBA16F, gw, gh, lv);\n      pass(P.HL_GUIDE, guide.fb, gw, gh, [['u_src', L.tex]], u => gl.uniform3fv(u.u_wb, wb));\n      gl.bindTexture(gl.TEXTURE_2D, guide.tex); gl.generateMipmap(gl.TEXTURE_2D);\n      pass(P.HL_RECON, rgb.fb, W, H, [['u_src', L.tex], ['u_guide', guide.tex]], u => { gl.uniform3fv(u.u_wb, wb); gl.uniform1f(u.u_lods, lv - 1); });\n      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, rgb.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fb);\n      gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);\n    }\n    gl.deleteFramebuffer(fb);\n    gl.bindTexture(gl.TEXTURE_2D, L.tex);\n    gl.generateMipmap(gl.TEXTURE_2D);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);\n  }\n\n  // Raw-domain denoise on packed, variance-stabilized planes (see the NR_* shaders).\n  function denoise(L, dst, opts) {\n    const { nr = 0, nrc = 0, method = 'wavelet', nlmR = 3 } = opts;\n    const d = L.src, w = d.width / 2, h = d.height / 2, [a, o = 0] = d.noise, b = o / (a * a);\n    const g = [0, 1, 2, 3].filter(k => d.cfa[k] === 1), perm = [d.cfa.indexOf(0), g[0], g[1], d.cfa.indexOf(2)];\n    const c = [tgt('nrA', gl.RGBA16F, w, h), tgt('nrB', gl.RGBA16F, w, h)], acc = [tgt('nrC', gl.RGBA16F, w, h), tgt('nrD', gl.RGBA16F, w, h)];\n    pass(P.NR_PACK, c[0].fb, w, h, [['u_raw', L.raw]], u => {\n      gl.uniform1f(u.u_black, d.black); gl.uniform1f(u.u_scale, 1 / (d.white - d.black));\n      gl.uniform1f(u.u_a, a); gl.uniform1f(u.u_b, b); gl.uniform4iv(u.u_perm, perm);\n    });\n    // real noise level relative to the profile (needs the first wavelet level)\n    pass(P.NR_ATROUS, c[1].fb, w, h, [['u_src', c[0].tex]], u => gl.uniform1i(u.u_step, 1));\n    const sigma = (L.noiseScale ??= measureNoise(c[0], c[1], w, h));\n\n    let kY = nr / 100 * 1.6; // luma capped lower: higher wipes real texture (sand, foliage)\n    const kC = nrc / 100 * 3.5;\n    let src = c[0];\n    if (method === 'nlm' && nr) { // luma by NLM, color still by wavelets below\n      // bandwidth in noise sigmas; PSNR peaks near 1.0 (tools/nr-bench.html), so the slider tops out a bit past it\n      const n = tgt('nrN', gl.RGBA16F, w, h), hk = opts.nlmH ?? nr / 100 * 1.3;\n      pass(P.NR_NLM, n.fb, w, h, [['u_src', c[0].tex]], u => {\n        gl.uniform1f(u.u_h2, 2 * (hk * sigma) ** 2); gl.uniform1f(u.u_sig2, sigma * sigma); gl.uniform1i(u.u_R, nlmR);\n      });\n      src = n; kY = 0;\n    }\n    // à-trous: c[ci] → c[1-ci] is one level; soft-thresholded details accumulate in acc\n    const ping = src === c[0] ? c : [src, c[1]];\n    let ci = 0, ai = 0;\n    ATROUS_SIGMA.forEach((sig, lv) => {\n      if (!(lv === 0 && src === c[0])) pass(P.NR_ATROUS, ping[1 - ci].fb, w, h, [['u_src', ping[ci].tex]], u => gl.uniform1i(u.u_step, 1 << lv));\n      pass(P.NR_DETAIL, acc[1 - ai].fb, w, h, [['u_c', ping[ci].tex], ['u_cn', ping[1 - ci].tex], ['u_acc', acc[ai].tex]], u => {\n        gl.uniform4f(u.u_thr, kY * sig * sigma, kC * sig * sigma, kC * sig * sigma, kC * sig * sigma); gl.uniform1i(u.u_first, lv === 0);\n      });\n      ci = 1 - ci; ai = 1 - ai;\n    });\n    pass(P.NR_UNPACK, dst.fb, d.width, d.height, [['u_acc', acc[ai].tex], ['u_c', ping[ci].tex]], u => {\n      gl.uniform4iv(u.u_perm, perm); gl.uniform1f(u.u_a, a); gl.uniform1f(u.u_b, b);\n    });\n  }\n\n  // DJI's NoiseProfile barely changes with ISO, so the stabilized noise is only roughly unit variance. Measure it from\n  // the finest wavelet level on a central crop with a robust MAD. Chroma planes only: after the orthonormal rotation\n  // noise is equal in every plane, but scene texture lands mostly in luma and would inflate the estimate.\n  function measureNoise(fine, coarse, w, h) {\n    const n = Math.min(512, w, h), x0 = (w - n) >> 1, y0 = (h - n) >> 1, A = new Float32Array(n * n * 4), B = new Float32Array(n * n * 4);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, fine.fb); gl.readPixels(x0, y0, n, n, gl.RGBA, gl.FLOAT, A);\n    gl.bindFramebuffer(gl.FRAMEBUFFER, coarse.fb); gl.readPixels(x0, y0, n, n, gl.RGBA, gl.FLOAT, B);\n    const diff = new Float32Array(n * n / 4);\n    const sig = [1, 2, 3].map(ch => {\n      for (let i = 0; i < diff.length; i++) diff[i] = Math.abs(A[i * 16 + ch] - B[i * 16 + ch]); // every 4th pixel\n      diff.sort();\n      return diff[diff.length >> 1] / 0.6745 / ATROUS_SIGMA[0];\n    }).sort((x, y) => x - y)[1];\n    return Math.min(8, Math.max(0.1, sig));\n  }\n\n  // Pick the luma denoiser for this device by timing one NLM pass on a 512² tile and extrapolating to a 3840² lens\n  // (1920² packed). NLM is ~2 dB better than wavelets (tools/nr-bench.html) but costs a search per pixel: use it\n  // when the estimate stays under `budget` ms per lens. Measured once; the readback forces the GPU to finish.\n  let method = null;\n  function pickMethod(budget = 400) {\n    if (method) return method;\n    const n = 512, src = tgt('nrBenchA', gl.RGBA16F, n, n), dst = tgt('nrBenchB', gl.RGBA16F, n, n);\n    const run = () => {\n      pass(P.NR_NLM, dst.fb, n, n, [['u_src', src.tex]], u => { gl.uniform1f(u.u_h2, 2); gl.uniform1f(u.u_sig2, 1); gl.uniform1i(u.u_R, 3); });\n      finish(dst.tex);\n    };\n    run(); // warm-up (shader compile, allocation)\n    const t0 = performance.now(); run(); const est = (performance.now() - t0) * (1920 * 1920) / (n * n);\n    free(['nrBenchA', 'nrBenchB']);\n    method = est < budget ? 'nlm' : 'wavelet';\n    return method;\n  }\n\n  // Scratch buffers are only needed while developing (≈210 MB): free them so phones keep their memory.\n  return { upload, develop, pickMethod, freeScratch: () => free(SCRATCH) };\n}\n","color.js":"// 3x3 matrix helpers, rotations, and DNG color math (white balance ↔ temperature/tint, camera → ProPhoto).\r\n\r\nexport const mm = (A, B) => A.map(r => [0, 1, 2].map(j => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));\r\nconst mv = (A, v) => A.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);\r\nexport const tr = A => A[0].map((_, j) => A.map(r => r[j]));\r\nconst m9 = a => [a.slice(0, 3), a.slice(3, 6), a.slice(6, 9)];\r\nfunction inv([[a, b, c], [d, e, f], [g, h, i]]) {\r\n  const A = e * i - f * h, B = f * g - d * i, C = d * h - e * g, det = a * A + b * B + c * C;\r\n  return [[A, c * h - b * i, b * f - c * e], [B, a * i - c * g, c * d - a * f], [C, b * g - a * h, a * e - b * d]].map(r => r.map(x => x / det));\r\n}\r\nexport const RAD = Math.PI / 180;\r\nexport const rx = a => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]];\r\nexport const ry = a => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]];\r\nexport const rz = a => [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]];\r\n// L = ry(yaw)·rx(pitch)·rz(roll)  →  [yaw, pitch, roll] in degrees\r\nexport const eulerYXZ = L => [Math.atan2(L[0][2], L[2][2]), Math.asin(-L[1][2]), Math.atan2(L[1][0], L[1][1])].map(a => a / RAD);\r\n// Rotation taking unit vector a onto unit vector b (Rodrigues). Opposite vectors (a camera hanging upside down) have no\r\n// unique axis: turn half way round x, which is perpendicular to \"down\".\r\nexport function fromTo(a, b) {\r\n  const c = a[0] * b[0] + a[1] * b[1] + a[2] * b[2];\r\n  if (c < -1 + 1e-12) return [[1, 0, 0], [0, -1, 0], [0, 0, -1]];\r\n  const v = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], k = 1 / (1 + c);\r\n  const V = [[0, -v[2], v[1]], [v[2], 0, -v[0]], [-v[1], v[0], 0]], V2 = mm(V, V);\r\n  return [0, 1, 2].map(i => [0, 1, 2].map(j => (i === j ? 1 : 0) + V[i][j] + V2[i][j] * k));\r\n}\r\n\r\nconst XYZ_PP = [[1.3459433, -0.2556075, -0.0511118], [-0.5445989, 1.5081673, 0.0205351], [0, 0, 1.2118128]];\r\nconst XYZ50_SRGB = [[3.1338561, -1.6168667, -0.4906146], [-0.9787684, 1.9161415, 0.0334540], [0.0719453, -0.2289914, 1.4052427]];\r\nexport const PP_SRGB = mm(XYZ50_SRGB, inv(XYZ_PP));\r\nconst BRADFORD = [[0.8951, 0.2664, -0.1614], [-0.7502, 1.7135, 0.0367], [0.0389, -0.0685, 1.0296]];\r\nconst D50 = [0.96422, 1, 0.82521];\r\nconst ILLUM_K = { 1: 5500, 2: 4150, 3: 2856, 4: 5500, 10: 6500, 11: 7500, 12: 6400, 13: 5000, 14: 4200, 15: 3450, 17: 2856, 18: 4874, 19: 6774, 20: 5503, 21: 6504, 22: 7504, 23: 5003, 24: 3200 };\r\n\r\nfunction adapt(src, dst) {\r\n  const s = mv(BRADFORD, src), d = mv(BRADFORD, dst);\r\n  return mm(inv(BRADFORD), mm([[d[0] / s[0], 0, 0], [0, d[1] / s[1], 0], [0, 0, d[2] / s[2]]], BRADFORD));\r\n}\r\n// Planckian locus in CIE 1960 uv (Krystek); tint uses the DNG SDK scale (1/3000 uv per unit, + = magenta)\r\nconst planck = T => [(0.860117757 + 1.54118254e-4 * T + 1.28641212e-7 * T * T) / (1 + 8.42420235e-4 * T + 7.08145163e-7 * T * T),\r\n  (0.317398726 + 4.22806245e-5 * T + 4.20481691e-8 * T * T) / (1 - 2.89741816e-5 * T + 1.61456053e-7 * T * T)];\r\nfunction normal(T) { const a = planck(T * 0.99), b = planck(T * 1.01), du = b[0] - a[0], dv = b[1] - a[1], l = Math.hypot(du, dv); return [dv / l, -du / l]; }\r\nexport function xyFromTempTint(T, tint) {\r\n  const p = planck(T), n = normal(T), o = -tint / 3000, u = p[0] + n[0] * o, v = p[1] + n[1] * o, d = 2 * u - 8 * v + 4;\r\n  return [3 * u / d, 2 * v / d];\r\n}\r\nexport function tempTintFromXY([x, y]) {\r\n  const d = -2 * x + 12 * y + 3, u = 4 * x / d, v = 6 * y / d;\r\n  const err = m => { const p = planck(1e6 / m); return (u - p[0]) ** 2 + (v - p[1]) ** 2; };\r\n  let a = 20, b = 700;\r\n  for (let i = 0; i < 60; i++) { const m1 = b - (b - a) * 0.618, m2 = a + (b - a) * 0.618; if (err(m1) < err(m2)) b = m2; else a = m1; }\r\n  const T = 2e6 / (a + b), p = planck(T), n = normal(T);\r\n  return [T, -3000 * ((u - p[0]) * n[0] + (v - p[1]) * n[1])];\r\n}\r\n// weight of illuminant 1 at temperature T (inverse-CCT interpolation, per DNG spec)\r\nexport function illumWeight(src, T) {\r\n  if (!src.cm2) return 1;\r\n  const t1 = ILLUM_K[src.illum1] || 2856, t2 = ILLUM_K[src.illum2] || 6504;\r\n  return Math.min(1, Math.max(0, (1 / T - 1 / t2) / (1 / t1 - 1 / t2)));\r\n}\r\nfunction cmAt(src, T) {\r\n  const g = illumWeight(src, T), a = m9(src.cm1), b = src.cm2 ? m9(src.cm2) : a;\r\n  return a.map((r, i) => r.map((x, j) => g * x + (1 - g) * b[i][j]));\r\n}\r\nexport function xyOfNeutral(src, n) {\r\n  let xy = [0.3457, 0.3585];\r\n  for (let i = 0; i < 5; i++) { const X = mv(inv(cmAt(src, tempTintFromXY(xy)[0])), n), s = X[0] + X[1] + X[2]; xy = [X[0] / s, X[1] / s]; }\r\n  return xy;\r\n}\r\nexport function neutralOfXY(src, xy) {\r\n  const n = mv(cmAt(src, tempTintFromXY(xy)[0]), [xy[0] / xy[1], 1, (1 - xy[0] - xy[1]) / xy[1]]);\r\n  return n.map(v => v / n[1]);\r\n}\r\n// white-balanced camera RGB (cam / neutral) -> linear ProPhoto (D50)\r\nexport function camToPP(src, n) {\r\n  const ci = inv(cmAt(src, tempTintFromXY(xyOfNeutral(src, n))[0]));\r\n  return mm(XYZ_PP, mm(adapt(mv(ci, n), D50), ci)).map(r => r.map((x, j) => x * n[j]));\r\n}\r\n","config.js":"// Static configuration: camera profiles, projections, UI tables, defaults and algorithm constants.\nconst RAD = Math.PI / 180;\n\n// ---------- camera profiles: fisheye model r = f·θ(1 + k1θ² + k2θ⁴), R = world→lens ----------\n// Fitted against the camera's own stitched JPG. World: x right, y down, z forward. `mount` (yaw, pitch, roll in degrees)\n// relates the drone body to that world, least-squares fitted over 17 shots' JPG leveling (0.72° rms), so any shot can be\n// leveled from its flight roll/pitch.\n// `ca`: lateral chromatic aberration left after the camera's own DNG warp, extra r² and r⁴ radial scale of red and blue\n// vs green. A fixed lens property, measured once offline (mean of per-shot fits over the sample shots: 17 Avata 360,\n// 11 X4), so nothing is estimated from the user's image.\nexport const PROFILES = [\n  { match: /FCA188|Avata ?360/i, name: 'DJI Avata 360', mount: [-1.10, 0.52, 17.29],\n    // lens 2 seam correction, mean of per-shot auto-align on textured shots; starting point + prior for new shots\n    l2: { ryaw: 0.156, rpitch: 0.235, rroll: 0.241, f2: 0.9897, cx2: -5.14, cy2: 3.81 }, lenses: {\n    UP: { f: 1143.811, cx: 1931.778, cy: 1922.828, k1: -0.0016576, k2: -0.00089411, rmax: 1870, ca: { R: [0, 0.00023], B: [-0.00009, -0.00047] },\n      R: [[0.96132109, 0.27541871, 0.00250993], [-0.00464392, 0.00709633, 0.99996404], [0.27539100, -0.96129817, 0.00810088]] },\n    DOWN: { f: 1045.327, cx: 1906.643, cy: 1921.074, k1: 0.0816073, k2: -0.0175507, rmax: 1870, ca: { R: [0.00003, 0.00008], B: [-0.00018, -0.00003] },\n      R: [[-0.96558136, -0.25978924, -0.01273536], [-0.01287472, -0.00116523, 0.99991644], [-0.25978237, 0.96566464, -0.00221959]] },\n  } },\n];\n// Unknown camera: ideal back-to-back equidistant lenses, ~190° each. Tune with the lens sliders.\nexport const generic = w => ({ name: 'Dual fisheye', mount: [0, 0, 0], lenses: {\n  0: { f: w / 2 / 1.66, cx: w / 2, cy: w / 2, k1: 0, k2: 0, rmax: w * 0.487, R: [[1, 0, 0], [0, 0, 1], [0, -1, 0]] },\n  1: { f: w / 2 / 1.66, cx: w / 2, cy: w / 2, k1: 0, k2: 0, rmax: w * 0.487, R: [[-1, 0, 0], [0, 0, 1], [0, 1, 0]] },\n} });\n\n// Insta360 (one DNG, lenses side by side): the camera's own per-shot calibration (unified/Mei model, see\n// instaCalibration in dng.js), moved from its calibW×calibH frame into each square half. Each half is the central\n// square of its lens's (calibW/2)×calibH area. Lens 1 faces backwards.\n ered as a horizontal strip: equirect in a frame whose pole is lens 0's axis. `k` stacks several\n// strips in one tall target (batched scoring).\nexport function drawBand(only, W, t, { mode = 1, k = 0, flow = false } = {}) {\n  const h = bandH(W);\n  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);\n  draw({ w: W, h, vy: k * h, res: [W, W / 2], off: Math.round(W / 4 - h / 2) - k * h, mode, only, flow, proj: 'equirect', fov: 360,\n    view: bandToWorld() });\n}\n\n// Score K candidates with one GPU round trip (each readback costs ~10 ms of sync even for a single pixel, drawing a\n// candidate ~0.1 ms). Candidate k reads a at rows +k·aStride, b at rows +k·bStride. Returns NCC per candidate.\nlet nccBuf = new Float32Array(0);\nexport function nccBatch(aTex, bTex, w, h, K, aStride, bStride, lodB) {\n  const bw = Math.ceil(w / 8), bh = Math.ceil(h / 8), r = tgt('ncc', gl.RGBA32F, bw, bh * K), u = ncc.u;\n  gl.bindFramebuffer(gl.FRAMEBUFFER, r.fb);\n  gl.useProgram(ncc.p);\n  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, aTex); gl.uniform1i(u.u_a, 0);\n  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bTex); gl.uniform1i(u.u_b, 1);\n  gl.uniform2i(u.u_size, w, h);\n  gl.uniform1i(u.u_jpg, lodB !== undefined);\n  gl.uniform1f(u.u_lodB, lodB || 0);\n  for (let k = 0; k < K; k++) {\n    gl.viewport(0, k * bh, bw, bh);\n    gl.uniform2i(u.u_aOff, 0, k * aStride); gl.uniform2i(u.u_bOff, 0, k * bStride); gl.uniform1i(u.u_rowOff, k * bh);\n    gl.drawArrays(gl.TRIANGLES, 0, 3);\n  }\n  const n4 = bw * bh * 4;\n  if (nccBuf.length < n4 * K) nccBuf = new Float32Array(n4 * K);\n  gl.readPixels(0, 0, bw, bh * K, gl.RGBA, gl.FLOAT, nccBuf);\n  return Array.from({ length: K }, (_, k) => {\n    let sab = 0, saa = 0, sbb = 0, n = 0;\n    for (let i = k * n4; i < (k + 1) * n4; i += 4) { sab += nccBuf[i]; saa += nccBuf[i + 1]; sbb += nccBuf[i + 2]; n += nccBuf[i + 3]; }\n    const score = sab / Math.sqrt(saa * sbb);\n    return n < 1000 || !Number.isFinite(score) ? 0
