<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>360 RAW Stitcher</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="view"></canvas>
<canvas id="fade" hidden aria-hidden="true"></canvas>
<div id="frame" hidden></div>

<header class="glass">
  <div class="brand"><img src="favicon.svg" alt=""><b data-i18n="title"></b></div>
  <button class="pill primary" id="open" data-i18n="open"></button>
  <button class="pill magic" id="export-btn" data-i18n="export" disabled></button>
  <input type="file" id="files" accept=".dng,.jpg,.jpeg,image/x-adobe-dng,image/jpeg" multiple hidden>
  <input type="file" id="folder" webkitdirectory hidden>
  <div class="chips" id="projs" role="radiogroup"></div>
  <button class="pill icon" id="theme-btn"><span aria-hidden="true">☾</span></button>
  <div class="seg" role="radiogroup" aria-label="Language">
    <label class="chip"><input type="radio" name="lang" value="zh"><span>中</span></label>
    <label class="chip"><input type="radio" name="lang" value="en"><span>EN</span></label>
  </div>
  <a class="btn pill heart" id="donate" target="_blank" rel="noopener" hidden>♥ <span data-i18n="donate"></span></a>
  <button class="pill icon" id="panel-btn" aria-controls="tools" aria-expanded="true" data-i18n-title="tools"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M12.5 3.5v13"/></svg></button>
</header>

<div id="empty" class="glass rim">
  <div class="zone">
    <img class="globe" src="favicon.svg" alt="">
    <div class="big" data-i18n="drop"></div>
    <p data-i18n="dropJpg"></p>
    <div class="row picks"><button class="primary pill" id="start-files" data-i18n="pickFiles"></button><button class="pill" id="start-folder" data-i18n="pickFolder"></button></div>
    <small data-i18n="privacy"></small>
    <small id="ioshint" data-i18n="iosHint" hidden></small>
    <small style="opacity:.6">This product includes DNG technology under license by Adobe. Not affiliated with DJI, Insta360 or Adobe.</small>
  </div>
</div>

<button class="glass" id="panel-handle" aria-controls="tools" data-i18n-title="tools"><span aria-hidden="true">›</span></button>
<aside class="glass" id="tools">
  <details open>
    <summary data-i18n="sView"></summary>
    <span class="sl" style="margin-bottom:0"><span data-i18n="aspect"></span></span>
    <div class="aspects" id="aspects" role="radiogroup"></div>
    <span class="sl" style="margin-bottom:0"><span data-i18n="guide"></span></span>
    <div class="aspects" role="radiogroup">
      <label class="chip"><input type="radio" name="guide" value="none"><span data-i18n="guideNone"></span></label>
      <label class="chip"><input type="radio" name="guide" value="thirds"><span data-i18n="guideThirds"></span></label>
      <label class="chip"><input type="radio" name="guide" value="grid"><span data-i18n="guideGrid"></span></label>
    </div>
    <div data-sliders="view"></div>
  </details>
  <details open>
    <summary data-i18n="sLevel"></summary>
    <label class="check"><input type="checkbox" data-k="grid"><span data-i18n="grid"></span></label>
    <div data-sliders="level"></div>
    <div class="row"><button id="autolevel" data-i18n="autoLevel"></button><button id="pick-level" data-i18n="pickLevel"></button><button id="reset-level" data-i18n="reset"></button></div>
    <small data-i18n="shiftHint"></small>
  </details>
  <details open>
    <summary data-i18n="sColor"></summary>
    <canvas id="hist" aria-hidden="true"></canvas>
    <div class="group" data-i18n="gWB"></div>
    <div data-sliders="wb"></div>
    <div class="row"><button id="asshot" data-i18n="asShot"></button></div>
    <div class="group" data-i18n="gTone"></div>
    <div class="row"><button id="lucky" data-i18n="lucky"></button></div>
    <div data-sliders="tone"></div>
    <div class="group" data-i18n="gPresence"></div>
    <div data-sliders="presence"></div>
    <div class="group" data-i18n="gNoise"></div>
    <div data-sliders="noise"></div>
  </details>
  <details>
    <summary data-i18n="sHsl"></summary>
    <div class="seg hsl-tabs" role="radiogroup">
      <label class="chip"><input type="radio" name="hslTab" value="hslH"><span data-i18n="hue"></span></label>
      <label class="chip"><input type="radio" name="hslTab" value="hslS" checked><span data-i18n="sat"></span></label>
      <label class="chip"><input type="radio" name="hslTab" value="hslL"><span data-i18n="lum"></span></label>
    </div>
    <div data-sliders="hslH" hidden></div>
    <div data-sliders="hslS"></div>
    <div data-sliders="hslL" hidden></div>
  </details>
  <details>
    <summary data-i18n="sLens"></summary>
    <label class="check"><input type="checkbox" data-k="autoAlign"><span data-i18n="autoAlign"></span></label>
    <label class="check"><input type="checkbox" data-k="flow"><span data-i18n="flowOn"></span></label>
    <label class="check"><input type="checkbox" data-k="ca"><span data-i18n="ca"></span></label>
    <label class="check"><input type="checkbox" data-k="safe"><span data-i18n="safe"></span></label>
    <div data-sliders="lens"></div>
  </details>
</aside>

<dialog id="open-dlg" class="glass rim" aria-labelledby="open-title">
  <form method="dialog">
    <b id="open-title" data-i18n="open"></b>
    <div class="drop" data-i18n="openDrop"></div>
    <ul id="shots" hidden></ul>
    <small id="open-msg"></small>
    <div class="row"><button type="button" id="pick-files" data-i18n="pickFiles"></button><button type="button" id="pick-folder" data-i18n="pickFolder"></button></div>
    <div class="row"><button value="cancel" data-i18n="cancel"></button></div>
  </form>
</dialog>

<dialog id="export-dlg" class="glass rim" aria-labelledby="export-title">
  <form method="dialog">
    <b id="export-title" data-i18n="sExport"></b>
    <select id="fmt">
      <option value="dng" data-i18n="fmtDng"></option>
      <option value="bayer" data-i18n="fmtBayer"></option>
      <option value="tiff" data-i18n="fmtTiff"></option>
      <option value="jpeg" data-i18n="fmtJpeg"></option>
    </select>
    <div class="row"><input type="number" id="ew" min="16" aria-label="width"><span aria-hidden="true">×</span><input type="number" id="eh" aria-label="height" readonly></div>
    <small id="native"></small>
    <label class="sl" id="q-row"><span data-i18n="quality"></span><output>95</output><input type="range" id="q" min="50" max="100" value="95"></label>
    <small data-i18n="exportNote"></small>
    <div class="row"><button value="cancel" data-i18n="cancel"></button><button class="magic" id="export" value="export" data-i18n="export"></button></div>
  </form>
</dialog>

<div id="status" class="glass"></div>
<dialog id="busy" class="glass rim" aria-live="polite">
  <div id="busy-msg"></div>
  <div class="bar"><i></i></div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
