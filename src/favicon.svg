<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>360 RAW Stitcher</title>
  <defs>
    <linearGradient id="hue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c7ff"/>
      <stop offset=".3" stop-color="#5e5ce6"/>
      <stop offset=".55" stop-color="#bf5af2"/>
      <stop offset=".78" stop-color="#ff2d92"/>
      <stop offset="1" stop-color="#ffd60a"/>
    </linearGradient>
    <radialGradient id="shine" cx=".34" cy=".28" r=".62">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="28"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect x="-8" y="-8" width="80" height="80" fill="url(#hue)"/>
    <circle cx="32" cy="32" r="28" fill="url(#shine)"/>
    <!-- equator and a meridian: a full sphere from two lenses -->
    <ellipse cx="32" cy="32" rx="28" ry="8.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.6"/>
    <ellipse cx="32" cy="32" rx="12" ry="28" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="2.6"/>
  </g>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="2"/>
</svg>
